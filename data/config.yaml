project:
  name: "Hospital-Data-Platform"
  version: "3.0.0"

spark:
  app_name: "HealthcareStreamingEngine"
  driver_memory: "8g"
  shuffle_partitions: "4"
  master: "local[*]"
  local_dir: "lakehouse/spark-tmp"
  kafka_package: "org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1"

paths:
  raw_encounters: "raw_ingestion"
  source_encounters: "source_dump/encounters_combined.csv"
  bronze: "lakehouse/bronze/encounters"
  raw_patients: "raw_ingestion/patients_combined.csv"
  raw_conditions: "raw_ingestion/conditions_combined.csv"
  raw_medications: "raw_ingestion/medications_combined.csv"
  raw_procedures: "raw_ingestion/procedures_combined.csv"
  raw_observations: "raw_ingestion/observations_combined.csv"
  raw_careplans: "raw_ingestion/careplans_combined.csv"
  raw_allergies: "raw_ingestion/allergies_combined.csv"
  raw_immunizations: "raw_ingestion/immunizations_combined.csv"
  bronze_checkpoint: "lakehouse/checkpoints/bronze"
  silver: "lakehouse/silver/clinical360"
  quarantine: "lakehouse/quarantine/encounters"
  patient_quarantine: "lakehouse/quarantine/patients"
  gold: "lakehouse/gold/clinical_metrics"
  gold_patient_360: "lakehouse/gold/patient_360"
  gold_care_gaps: "lakehouse/gold/care_gaps"
  gold_comorbidity_pairs: "lakehouse/gold/comorbidity_pairs"
  gold_return_gaps: "lakehouse/gold/return_gaps"
  gold_completeness_scorecard: "lakehouse/gold/completeness_scorecard"
  gold_disease_rankings: "lakehouse/gold/disease_rankings"
  audit_logs: "lakehouse/audit/metadata"
  processed_files: "lakehouse/audit/processed_files"
  features:
    patients: "lakehouse/features/patients"
    observations_by_encounter: "lakehouse/features/observations_by_encounter"
    conditions_by_encounter: "lakehouse/features/conditions_by_encounter"
    conditions_by_patient: "lakehouse/features/conditions_by_patient"
    medications_by_encounter: "lakehouse/features/medications_by_encounter"
    procedures_by_encounter: "lakehouse/features/procedures_by_encounter"
    careplans_by_encounter: "lakehouse/features/careplans_by_encounter"
    allergies_by_patient: "lakehouse/features/allergies_by_patient"
    immunizations_by_patient: "lakehouse/features/immunizations_by_patient"

quality_gates: {}

tables:
  processed_files: ""

streaming:
  source: "file"

kafka:
  bootstrap_servers: "localhost:9092"
  encounters_topic: "synthea.encounters"
  starting_offsets: "earliest"
  checkpoint: "lakehouse/checkpoints/kafka_encounters"
  bronze_checkpoint: "lakehouse/checkpoints/kafka_bronze_domains"
  cursor_path: "lakehouse/checkpoints/kafka_publish_cursor.json"
  dlq_topic: "synthea.dlq"
  bronze_root: "lakehouse/bronze/kafka"
  silver_root: "lakehouse/silver/kafka"
  domains:
    encounters:
      topic: "synthea.encounters"
      source: "source_dump/encounters_combined.csv"
      partitions: 4
      required_fields: ["ID", "PATIENT", "DATE"]
      natural_key_fields: ["ID"]
    patients:
      topic: "synthea.patients"
      source: "raw_ingestion/patients_combined.csv"
      partitions: 2
      required_fields: ["ID", "BIRTHDATE"]
      natural_key_fields: ["ID"]
    conditions:
      topic: "synthea.conditions"
      source: "raw_ingestion/conditions_combined.csv"
      partitions: 3
      required_fields: ["PATIENT", "ENCOUNTER", "DESCRIPTION", "START"]
      natural_key_fields: ["PATIENT", "ENCOUNTER", "CODE", "START"]
    medications:
      topic: "synthea.medications"
      source: "raw_ingestion/medications_combined.csv"
      partitions: 3
      required_fields: ["PATIENT", "DESCRIPTION", "START"]
      natural_key_fields: ["PATIENT", "ENCOUNTER", "CODE", "START"]
    observations:
      topic: "synthea.observations"
      source: "raw_ingestion/observations_combined.csv"
      partitions: 4
      required_fields: ["PATIENT", "ENCOUNTER", "DESCRIPTION", "DATE"]
      natural_key_fields: ["PATIENT", "ENCOUNTER", "CODE", "DATE"]
    procedures:
      topic: "synthea.procedures"
      source: "raw_ingestion/procedures_combined.csv"
      partitions: 2
      required_fields: ["PATIENT", "ENCOUNTER", "DESCRIPTION", "DATE"]
      natural_key_fields: ["PATIENT", "ENCOUNTER", "CODE", "DATE"]
    careplans:
      topic: "synthea.careplans"
      source: "raw_ingestion/careplans_combined.csv"
      partitions: 2
      required_fields: ["PATIENT", "ENCOUNTER", "DESCRIPTION", "START"]
      natural_key_fields: ["ID"]
    allergies:
      topic: "synthea.allergies"
      source: "raw_ingestion/allergies_combined.csv"
      partitions: 1
      required_fields: ["PATIENT", "DESCRIPTION", "START"]
      natural_key_fields: ["PATIENT", "CODE", "START"]
    immunizations:
      topic: "synthea.immunizations"
      source: "raw_ingestion/immunizations_combined.csv"
      partitions: 2
      required_fields: ["PATIENT", "DESCRIPTION", "DATE"]
      natural_key_fields: ["PATIENT", "CODE", "DATE"]

serving:
  snapshot_path: "../reports/gold_snapshot.json"
